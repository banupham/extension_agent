name: runtime-syntax

on:
  push:
    paths:
      - 'control-center/**'
      - 'recorder/**'
      - 'training-collector/**'
      - '.github/workflows/extension-syntax.yml'
  pull_request:
    paths:
      - 'control-center/**'
      - 'recorder/**'
      - 'training-collector/**'

jobs:
  syntax:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check JavaScript syntax
        run: |
          node --check control-center/extension/stealth-extension/background.js
          node --check control-center/extension/agent-runtime-extension/target_registry.js
          node --check control-center/extension/agent-runtime-extension/cdp_plan_dispatcher.js
          node --check control-center/extension/agent-runtime-extension/broker_client.js
          node --check control-center/extension/agent-runtime-extension/background.js
          node --check control-center/manager/control_center.js
          node --check control-center/manager/public/app.js
          node --check control-center/manager/strategy/index.js
          node --check control-center/manager/strategy/contracts.js
          node --check control-center/manager/strategy/baseline_strategy.js
          node --check control-center/manager/strategy/agent_action_contract.js
          node --check control-center/manager/strategy/execution_behavior_contract.js
          node --check control-center/manager/behavior/empirical_policy.js
          node --check control-center/manager/execution/cdp_plan.js
          node --check control-center/manager/execution/form_plan.js
          node --check control-center/manager/execution/media_plan.js
          node --check control-center/manager/goal/goal_checker.js
          node --check control-center/manager/goal/outcome_controller.js
          node --check control-center/manager/goal/episode_budget.js
          node --check control-center/manager/agent/one_action_bridge.js
          node --check control-center/manager/agent/broker_runtime_client.js
          node --check control-center/server/server.js
          node --check control-center/script/agent_one_action.js
          node --check control-center/script/goal_checker_gate.js
          node --check control-center/script/outcome_control_gate.js
          node --check control-center/script/checks/run_check.js
          node --check control-center/script/checks/device_behavior.js
          node --check control-center/script/checks/strategy_contract.js
          node --check control-center/script/checks/goal_checker.js
          node --check control-center/script/checks/outcome_controller.js
          node --check control-center/script/checks/episode_budget.js
          node --check control-center/script/checks/agent_action_contract.js
          node --check control-center/script/checks/empirical_behavior_policy.js
          node --check control-center/script/checks/agent_runtime_target_registry.js
          node --check control-center/script/checks/form_state_registry.js
          node --check control-center/script/checks/form_control_plan.js
          node --check control-center/script/checks/media_state_registry.js
          node --check control-center/script/checks/media_control_plan.js
          node --check control-center/script/checks/media_bridge.js
          node --check control-center/script/checks/cdp_execution_plan.js
          node --check control-center/script/checks/cdp_plan_dispatcher.js
          node --check control-center/script/checks/one_action_bridge.js
          node --check control-center/script/checks/tab_lifecycle_bridge.js
          node --check control-center/script/checks/agent_runtime_broker_client.js
          node --check control-center/script/checks/broker_runtime_client.js
          node --check control-center/script/checks/agent_one_action_cli.js
          node --check recorder/background.js
          node --check recorder/content.js
          node --check recorder/popup.js
          node --check training-collector/core/privacy.js
          node --check training-collector/core/action_normalizer.js
          node --check training-collector/core/state_diff.js
          node --check training-collector/core/episode_builder.js
          node --check training-collector/core/raw_session_store.js
          node --check training-collector/core/indexeddb_chunk_store.js
          node --check training-collector/core/reliable_sender.js
          node --check training-collector/core/socket_mirror.js
          node --check training-collector/observer/element_registry.js
          node --check training-collector/observer/semantic_observer.js
          node --check training-collector/observer/mutation_trace.js
          node --check training-collector/observer/hover_trace.js
          node --check training-collector/observer/route_trace.js
          node --check training-collector/correlation/physical_semantic_correlator.js
          node --check training-collector/correlation/action_target_resolver.js
          node --check training-collector/capture/physical_capture.js
          node --check training-collector/capture/dom_capture.js
          node --check training-collector/tools/analyze_raw.js
          node --check training-collector/tools/build_action_semantics.js
          node --check training-collector/tools/build_action_windows.js
          node --check training-collector/tools/analyze_action_windows.js
          node --check training-collector/tools/extract_behavior_features.js
          node --check training-collector/tools/analyze_behavior_features.js
          node --check training-collector/tools/build_behavior_baseline.js
          node --check training-collector/socket-server/server.js
          node --check training-collector/socket-server/integration_test.js
          node --check training-collector/background.js
          node --check training-collector/content.js
          node --check training-collector/popup.js
          node --check training-collector/tests/architecture_contract.js
          node --check training-collector/tests/raw_session_contract.js
          node --check training-collector/tests/raw_analysis_contract.js
          node --check training-collector/tests/v06_storage_contract.js
          node --check training-collector/tests/v07_action_semantics_contract.js
          node --check training-collector/tests/v072_frame_stream_contract.js
          node --check training-collector/tests/v08_socket_mirror_contract.js
          node --check training-collector/tests/action_window_contract.js
          node --check training-collector/tests/action_window_quality_contract.js
          node --check training-collector/tests/behavior_feature_contract.js
          node --check training-collector/tests/behavior_feature_analysis_contract.js
      - name: Validate extension manifests and Agent contracts JSON
        run: |
          node -e "const fs=require('fs'); ['training-collector/manifest.json','control-center/extension/agent-runtime-extension/manifest.json','control-center/AGENT_ACTION_CONTRACT.json','control-center/GOAL_CHECKER_CONTRACT.json','control-center/OUTCOME_CONTROL_CONTRACT.json','control-center/EPISODE_BUDGET_CONTRACT.json'].forEach(p=>JSON.parse(fs.readFileSync(p,'utf8')))"
      - name: Run strategy + A5.1-A5.3 contract smoke test
        run: node control-center/script/checks/strategy_contract.js
      - name: Run Agent action + behavior contract smoke test
        run: node control-center/script/checks/agent_action_contract.js
      - name: Run A3 empirical behavior policy contract test
        run: node control-center/script/checks/empirical_behavior_policy.js
      - name: Run Agent Runtime target registry contract test
        run: node control-center/script/checks/agent_runtime_target_registry.js
      - name: Run observed form-state registry contract test
        run: node control-center/script/checks/form_state_registry.js
      - name: Run semantic form-control planner contract test
        run: node control-center/script/checks/form_control_plan.js
      - name: Run observed media-state registry contract test
        run: node control-center/script/checks/media_state_registry.js
      - name: Run semantic media-control planner contract test
        run: node control-center/script/checks/media_control_plan.js
      - name: Run media one-action bridge contract test
        run: node control-center/script/checks/media_bridge.js
      - name: Run CDP execution planner contract test
        run: node control-center/script/checks/cdp_execution_plan.js
      - name: Run CDP plan dispatcher contract test
        run: node control-center/script/checks/cdp_plan_dispatcher.js
      - name: Run one-action Agent bridge contract test
        run: node control-center/script/checks/one_action_bridge.js
      - name: Run tab lifecycle one-action bridge contract test
        run: node control-center/script/checks/tab_lifecycle_bridge.js
      - name: Run Agent Runtime broker client contract test
        run: node control-center/script/checks/agent_runtime_broker_client.js
      - name: Run Manager broker runtime adapter contract test
        run: node control-center/script/checks/broker_runtime_client.js
      - name: Run native one-action harness contract test
        run: node control-center/script/checks/agent_one_action_cli.js
      - name: Run Phase A1 Action Window Builder contract test
        run: node training-collector/tests/action_window_contract.js
      - name: Run Phase A1 training eligibility contract test
        run: node training-collector/tests/action_window_quality_contract.js
      - name: Run Phase A2 behavior feature contract test
        run: node training-collector/tests/behavior_feature_contract.js
      - name: Run Phase A2 behavior feature analysis contract test
        run: node training-collector/tests/behavior_feature_analysis_contract.js
      - name: Run Collector architecture contract smoke test
        run: node training-collector/tests/architecture_contract.js
      - name: Run Collector raw session contract test
        run: node training-collector/tests/raw_session_contract.js
      - name: Run Collector raw analysis contract test
        run: node training-collector/tests/raw_analysis_contract.js
      - name: Run Collector inherited IndexedDB reliability contract test
        run: node training-collector/tests/v06_storage_contract.js
      - name: Run Collector inherited V0.7 action semantics contract test
        run: node training-collector/tests/v07_action_semantics_contract.js
      - name: Run Collector inherited V0.7.2 frame stream contract test
        run: node training-collector/tests/v072_frame_stream_contract.js
      - name: Run Collector V0.8 socket mirror contract test
        run: node training-collector/tests/v08_socket_mirror_contract.js
      - name: Install socket server dependency
        run: npm install --prefix training-collector/socket-server --no-audit --no-fund
      - name: Run Collector V0.8 socket server integration test
        run: npm test --prefix training-collector/socket-server
