name: strategy-teaching-coverage

on:
  push:
    branches:
      - feat/agent-tab-context
    paths:
      - 'control-center/script/page_strategy_teaching_lab.js'
      - 'training-collector/core/episode_stop_settlement.js'
      - 'training-collector/popup.html'
      - 'training-collector/popup.js'
      - 'training-collector/tests/episode_stop_settlement_contract.js'
      - 'training-collector/tests/strategy_teaching_coverage_contract.js'
      - 'control-center/manager/training/episode_dataset_export.js'
      - 'training-collector/tools/check_strategy_baseline_readiness.js'
      - '.github/workflows/strategy-teaching-coverage.yml'
  workflow_dispatch:

jobs:
  strategy-teaching-coverage-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check syntax
        run: |
          node --check control-center/script/page_strategy_teaching_lab.js
          node --check training-collector/core/episode_stop_settlement.js
          node --check training-collector/popup.js
          node --check training-collector/tests/episode_stop_settlement_contract.js
          node --check training-collector/tests/strategy_teaching_coverage_contract.js
      - name: Run episode stop settlement contract
        run: node training-collector/tests/episode_stop_settlement_contract.js
      - name: Run Strategy teaching coverage contract
        run: node training-collector/tests/strategy_teaching_coverage_contract.js
