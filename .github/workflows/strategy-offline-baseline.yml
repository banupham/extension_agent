name: strategy-offline-baseline

on:
  push:
    branches:
      - feat/agent-tab-context
    paths:
      - 'training-collector/tools/fit_strategy_offline_baseline.js'
      - 'training-collector/tools/check_strategy_baseline_readiness.js'
      - 'training-collector/tests/strategy_offline_baseline_contract.js'
      - '.github/workflows/strategy-offline-baseline.yml'
  workflow_dispatch:

jobs:
  baseline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check syntax
        run: |
          node --check training-collector/tools/fit_strategy_offline_baseline.js
          node --check training-collector/tests/strategy_offline_baseline_contract.js
      - name: Run offline Strategy baseline contract
        run: node training-collector/tests/strategy_offline_baseline_contract.js
