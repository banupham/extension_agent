name: strategy-offline-baseline

on:
  push:
    branches:
      - feat/agent-tab-context
    paths:
      - 'training-collector/tools/fit_strategy_offline_baseline.js'
      - 'training-collector/tools/check_strategy_baseline_readiness.js'
      - 'training-collector/tests/strategy_offline_baseline_contract.js'
      - 'control-center/manager/strategy/offline_baseline_provider.js'
      - 'control-center/manager/strategy/index.js'
      - 'control-center/manager/agent/one_action_bridge.js'
      - 'control-center/manager/agent/bounded_two_step_execution.js'
      - 'control-center/manager/agent/bounded_episode_loop.js'
      - 'control-center/script/offline_strategy_native_one_action_gate.js'
      - 'control-center/script/offline_strategy_replan_gate.js'
      - 'control-center/script/offline_strategy_bounded_two_step_gate.js'
      - 'control-center/script/offline_strategy_bounded_episode_loop_gate.js'
      - 'control-center/script/checks/one_action_semantic_settle.js'
      - 'control-center/script/checks/offline_strategy_provider.js'
      - 'control-center/script/checks/offline_strategy_native_one_action.js'
      - 'control-center/script/checks/offline_strategy_replan.js'
      - 'control-center/script/checks/offline_strategy_bounded_two_step.js'
      - 'control-center/script/checks/offline_strategy_bounded_episode_loop.js'
      - '.github/workflows/strategy-offline-baseline.yml'
  workflow_dispatch:

jobs:
  baseline-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check syntax
        run: |
          node --check training-collector/tools/fit_strategy_offline_baseline.js
          node --check training-collector/tests/strategy_offline_baseline_contract.js
          node --check control-center/manager/strategy/offline_baseline_provider.js
          node --check control-center/manager/agent/one_action_bridge.js
          node --check control-center/manager/agent/bounded_two_step_execution.js
          node --check control-center/manager/agent/bounded_episode_loop.js
          node --check control-center/script/checks/one_action_semantic_settle.js
          node --check control-center/script/checks/offline_strategy_provider.js
          node --check control-center/script/offline_strategy_native_one_action_gate.js
          node --check control-center/script/checks/offline_strategy_native_one_action.js
          node --check control-center/script/offline_strategy_replan_gate.js
          node --check control-center/script/checks/offline_strategy_replan.js
          node --check control-center/script/offline_strategy_bounded_two_step_gate.js
          node --check control-center/script/checks/offline_strategy_bounded_two_step.js
          node --check control-center/script/offline_strategy_bounded_episode_loop_gate.js
          node --check control-center/script/checks/offline_strategy_bounded_episode_loop.js
      - name: Run semantic post-action settle contract
        run: node control-center/script/checks/one_action_semantic_settle.js
      - name: Run offline Strategy baseline contract
        run: node training-collector/tests/strategy_offline_baseline_contract.js
      - name: Run offline Strategy provider contract
        run: node control-center/script/checks/offline_strategy_provider.js
      - name: Run native offline Strategy one-action contract
        run: node control-center/script/checks/offline_strategy_native_one_action.js
      - name: Run offline Strategy one-step replan contract
        run: node control-center/script/checks/offline_strategy_replan.js
      - name: Run offline Strategy bounded two-step contract
        run: node control-center/script/checks/offline_strategy_bounded_two_step.js
      - name: Run offline Strategy bounded episode loop contract
        run: node control-center/script/checks/offline_strategy_bounded_episode_loop.js
