name: strategy-incremental-learning

on:
  push:
    branches: [main, feat/agent-tab-context]
    paths:
      - 'training-collector/tools/prepare_incremental_strategy_learning.js'
      - 'training-collector/tools/evaluate_machine_training_eligibility.js'
      - 'training-collector/tools/build_incremental_strategy_dataset.js'
      - 'training-collector/tools/prepare_human_learning_batch.js'
      - 'training-collector/tools/prepare_strategy_review_pack.js'
      - 'training-collector/tools/score_strategy_review_pack.js'
      - 'training-collector/tools/prepare_strategy_review_drafts.js'
      - 'training-collector/tools/resolve_strategy_teaching_batch.js'
      - 'training-collector/tools/prepare_strategy_approval_candidates.js'
      - 'training-collector/tools/apply_strategy_approval_candidates.js'
      - 'training-collector/tools/build_strategy_dataset_from_approvals.js'
      - 'training-collector/tools/check_strategy_baseline_readiness.js'
      - 'training-collector/tools/fit_strategy_offline_baseline.js'
      - 'training-collector/tests/incremental_strategy_learning_contract.js'
      - 'training-collector/tests/incremental_strategy_dataset_contract.js'
      - 'training-collector/tests/human_learning_batch_contract.js'
      - 'training-collector/tests/strategy_teaching_batch_resolver_contract.js'
      - 'training-collector/tests/strategy_approval_pipeline_contract.js'
      - '.github/workflows/strategy-incremental-learning.yml'
  pull_request:
    paths:
      - 'training-collector/tools/prepare_incremental_strategy_learning.js'
      - 'training-collector/tools/evaluate_machine_training_eligibility.js'
      - 'training-collector/tools/build_incremental_strategy_dataset.js'
      - 'training-collector/tools/prepare_human_learning_batch.js'
      - 'training-collector/tools/prepare_strategy_review_pack.js'
      - 'training-collector/tools/score_strategy_review_pack.js'
      - 'training-collector/tools/prepare_strategy_review_drafts.js'
      - 'training-collector/tools/resolve_strategy_teaching_batch.js'
      - 'training-collector/tools/prepare_strategy_approval_candidates.js'
      - 'training-collector/tools/apply_strategy_approval_candidates.js'
      - 'training-collector/tools/build_strategy_dataset_from_approvals.js'
      - 'training-collector/tools/check_strategy_baseline_readiness.js'
      - 'training-collector/tools/fit_strategy_offline_baseline.js'
      - 'training-collector/tests/incremental_strategy_learning_contract.js'
      - 'training-collector/tests/incremental_strategy_dataset_contract.js'
      - 'training-collector/tests/human_learning_batch_contract.js'
      - 'training-collector/tests/strategy_teaching_batch_resolver_contract.js'
      - 'training-collector/tests/strategy_approval_pipeline_contract.js'
      - '.github/workflows/strategy-incremental-learning.yml'

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check incremental pipeline syntax
        run: |
          node --check training-collector/tools/prepare_incremental_strategy_learning.js
          node --check training-collector/tools/evaluate_machine_training_eligibility.js
      - name: Run incremental Strategy learning boundary contract
        run: node training-collector/tests/incremental_strategy_learning_contract.js
      - name: Run incremental Strategy dataset split-preservation contract
        run: node training-collector/tests/incremental_strategy_dataset_contract.js
      - name: Run privacy-safe human learning batch contract
        run: node training-collector/tests/human_learning_batch_contract.js
      - name: Run Strategy teaching resolver contract
        run: node training-collector/tests/strategy_teaching_batch_resolver_contract.js
      - name: Run explicit approval and dataset boundary contract
        run: node training-collector/tests/strategy_approval_pipeline_contract.js
