name: strategy-action-target-decoupling

on:
  push:
    branches:
      - feat/agent-tab-context
    paths:
      - 'control-center/manager/strategy/offline_baseline_provider.js'
      - 'training-collector/tools/fit_strategy_offline_baseline.js'
      - 'training-collector/tests/strategy_action_target_decoupling_contract.js'
      - '.github/workflows/strategy-action-target-decoupling.yml'
  workflow_dispatch:

jobs:
  contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check syntax
        run: |
          node --check control-center/manager/strategy/offline_baseline_provider.js
          node --check training-collector/tools/fit_strategy_offline_baseline.js
          node --check training-collector/tests/strategy_action_target_decoupling_contract.js
      - name: Run action target decoupling contract
        run: node training-collector/tests/strategy_action_target_decoupling_contract.js
