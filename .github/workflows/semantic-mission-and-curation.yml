name: semantic-mission-and-curation

on:
  push:
    branches:
      - feat/agent-tab-context
    paths:
      - 'control-center/manager/mission/semantic_goal_resolver.js'
      - 'control-center/manager/mission/semantic_mission_interpreter.js'
      - 'control-center/manager/mission/mission_strategy_executor.js'
      - 'control-center/manager/world/semantic_world_model.js'
      - 'control-center/manager/behavior/empirical_policy.js'
      - 'control-center/manager/behavior/baseline_loader.js'
      - 'control-center/manager/strategy/agent_action_contract.js'
      - 'control-center/manager/strategy/execution_behavior_contract.js'
      - 'control-center/script/page_semantic_mission_lab.js'
      - 'control-center/script/offline_strategy_semantic_mission_gate.js'
      - 'control-center/script/checks/semantic_goal_resolver.js'
      - 'control-center/script/checks/mission_semantic_goal_execution.js'
      - 'control-center/script/checks/offline_strategy_semantic_mission.js'
      - 'control-center/script/checks/empirical_behavior_policy.js'
      - 'control-center/script/checks/agent_action_contract.js'
      - 'control-center/script/checks/behavior_baseline_runtime_loading.js'
      - 'training-collector/tools/build_behavior_baseline.js'
      - 'training-collector/tools/curate_random_human_data.js'
      - 'training-collector/tools/prepare_human_learning_batch.js'
      - 'training-collector/tools/build_behavior_batch_baseline.js'
      - 'training-collector/tools/evaluate_behavior_batch_baseline.js'
      - 'training-collector/tools/prepare_strategy_review_pack.js'
      - 'training-collector/tools/score_strategy_review_pack.js'
      - 'training-collector/tools/prepare_strategy_review_drafts.js'
      - 'training-collector/tools/resolve_strategy_review_ambiguity.js'
      - 'training-collector/tools/profile_strategy_ambiguity_evidence.js'
      - 'training-collector/tools/prepare_strategy_approval_candidates.js'
      - 'training-collector/tools/apply_strategy_approval_candidates.js'
      - 'training-collector/tools/build_strategy_dataset_from_approvals.js'
      - 'training-collector/tests/random_human_data_curator_contract.js'
      - 'training-collector/tests/human_learning_batch_contract.js'
      - 'training-collector/tests/quarantine_diagnostic_contract.js'
      - 'training-collector/tests/human_learning_next_stage_contract.js'
      - 'training-collector/tests/behavior_batch_heldout_contract.js'
      - 'training-collector/tests/strategy_review_triage_contract.js'
      - 'training-collector/tests/strategy_review_draft_contract.js'
      - 'training-collector/tests/strategy_ambiguity_resolver_contract.js'
      - 'training-collector/tests/strategy_ambiguity_profiler_contract.js'
      - 'training-collector/tests/strategy_approval_pipeline_contract.js'
      - '.github/workflows/semantic-mission-and-curation.yml'
  workflow_dispatch:

jobs:
  semantic-mission-curation-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check syntax
        run: |
          node --check control-center/manager/mission/semantic_goal_resolver.js
          node --check control-center/manager/mission/mission_strategy_executor.js
          node --check control-center/manager/behavior/empirical_policy.js
          node --check control-center/manager/behavior/baseline_loader.js
          node --check control-center/manager/strategy/agent_action_contract.js
          node --check control-center/manager/strategy/execution_behavior_contract.js
          node --check control-center/script/page_semantic_mission_lab.js
          node --check control-center/script/offline_strategy_semantic_mission_gate.js
          node --check control-center/script/checks/offline_strategy_semantic_mission.js
          node --check control-center/script/checks/empirical_behavior_policy.js
          node --check control-center/script/checks/agent_action_contract.js
          node --check control-center/script/checks/behavior_baseline_runtime_loading.js
          node --check training-collector/tools/build_behavior_baseline.js
          node --check training-collector/tools/curate_random_human_data.js
          node --check training-collector/tools/prepare_human_learning_batch.js
          node --check training-collector/tools/build_behavior_batch_baseline.js
          node --check training-collector/tools/evaluate_behavior_batch_baseline.js
          node --check training-collector/tools/prepare_strategy_review_pack.js
          node --check training-collector/tools/score_strategy_review_pack.js
          node --check training-collector/tools/prepare_strategy_review_drafts.js
          node --check training-collector/tools/resolve_strategy_review_ambiguity.js
          node --check training-collector/tools/profile_strategy_ambiguity_evidence.js
          node --check training-collector/tools/prepare_strategy_approval_candidates.js
          node --check training-collector/tools/apply_strategy_approval_candidates.js
          node --check training-collector/tools/build_strategy_dataset_from_approvals.js
          node --check training-collector/tests/random_human_data_curator_contract.js
          node --check training-collector/tests/human_learning_batch_contract.js
          node --check training-collector/tests/quarantine_diagnostic_contract.js
          node --check training-collector/tests/human_learning_next_stage_contract.js
          node --check training-collector/tests/behavior_batch_heldout_contract.js
          node --check training-collector/tests/strategy_review_triage_contract.js
          node --check training-collector/tests/strategy_review_draft_contract.js
          node --check training-collector/tests/strategy_ambiguity_resolver_contract.js
          node --check training-collector/tests/strategy_ambiguity_profiler_contract.js
          node --check training-collector/tests/strategy_approval_pipeline_contract.js
      - name: Run semantic goal resolver contract
        run: node control-center/script/checks/semantic_goal_resolver.js
      - name: Run semantic mission execution contract
        run: node control-center/script/checks/mission_semantic_goal_execution.js
      - name: Run semantic mission native gate contract
        run: node control-center/script/checks/offline_strategy_semantic_mission.js
      - name: Run agent action contract
        run: node control-center/script/checks/agent_action_contract.js
      - name: Run empirical behavior policy contract
        run: node control-center/script/checks/empirical_behavior_policy.js
      - name: Run behavior baseline runtime loading contract
        run: node control-center/script/checks/behavior_baseline_runtime_loading.js
      - name: Run random human data curator contract
        run: node training-collector/tests/random_human_data_curator_contract.js
      - name: Run human learning batch contract
        run: node training-collector/tests/human_learning_batch_contract.js
      - name: Run safe quarantine diagnostic contract
        run: node training-collector/tests/quarantine_diagnostic_contract.js
      - name: Run human learning next-stage contract
        run: node training-collector/tests/human_learning_next_stage_contract.js
      - name: Run heldout behavior evaluation contract
        run: node training-collector/tests/behavior_batch_heldout_contract.js
      - name: Run strategy review triage contract
        run: node training-collector/tests/strategy_review_triage_contract.js
      - name: Run strategy review draft contract
        run: node training-collector/tests/strategy_review_draft_contract.js
      - name: Run strategy ambiguity resolver contract
        run: node training-collector/tests/strategy_ambiguity_resolver_contract.js
      - name: Run strategy ambiguity profiler contract
        run: node training-collector/tests/strategy_ambiguity_profiler_contract.js
      - name: Run explicit strategy approval pipeline contract
        run: node training-collector/tests/strategy_approval_pipeline_contract.js
