name: strategy-teaching-batch-resolver

on:
  push:
    branches:
      - feat/agent-tab-context
    paths:
      - 'training-collector/tools/resolve_strategy_teaching_batch.js'
      - 'training-collector/tools/prepare_strategy_review_pack.js'
      - 'training-collector/tools/prepare_strategy_review_drafts.js'
      - 'training-collector/tools/prepare_strategy_approval_candidates.js'
      - 'training-collector/tests/strategy_teaching_batch_resolver_contract.js'
      - 'training-collector/tests/strategy_text_form_sequence_resolver_contract.js'
      - '.github/workflows/strategy-teaching-batch-resolver.yml'
  workflow_dispatch:

jobs:
  teaching-batch-resolver-contract:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
      - name: Check syntax
        run: |
          node --check training-collector/tools/resolve_strategy_teaching_batch.js
          node --check training-collector/tests/strategy_teaching_batch_resolver_contract.js
          node --check training-collector/tests/strategy_text_form_sequence_resolver_contract.js
      - name: Run Strategy teaching batch resolver contracts
        run: |
          node training-collector/tests/strategy_teaching_batch_resolver_contract.js
          node training-collector/tests/strategy_text_form_sequence_resolver_contract.js
